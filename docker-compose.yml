services:
  backend:
    restart: unless-stopped
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - OPENAI_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - CHAT_MODEL=qwen3.7-max
      # Qwen3.5+ 是混合思考模型，Max 系列默认开 thinking；流式 chat 不能等思考过程
      - ENABLE_THINKING=false
      - QDRANT_HOST=qdrant
      - REDIS_URL=redis://redis:6379/0
      - USER_DB_PATH=/app/data/memobot.db
      - JWT_SECRET=${JWT_SECRET:-memobot-dev-secret-change-me}
      - DEV_MODE=${DEV_MODE:-true}
      - EVAL_USER_ID=a0000001-0000-4000-8000-000000000001
      - EVAL_USER_PHONE=13800000001
      - INTENT_MODEL=qwen3.7-plus
      - INTENT_MODEL_TEMPERATURE=0
      - INTENT_CLASSIFIER_ENABLED=true
      - PROMPT_TIMEZONE=Asia/Shanghai
      - EVAL_PASS_THRESHOLD=0.85
      # 线上聊天评估结果落盘目录（容器内）。bind mount ./backend:/app 后，
      # host 上对应 backend/eval/exports/reviews，再经 NFS 给 mac 同步可见。
      - EVAL_CHAT_REVIEWS_DIR=/app/eval/exports/reviews
      - TZ=Asia/Shanghai
    volumes:
      - ./backend:/app
      - memobot_data:/app/data
    command: >
      sh -c "unset NO_PROXY no_proxy ALL_PROXY all_proxy HTTP_PROXY http_proxy HTTPS_PROXY https_proxy && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - redis
      - qdrant

  celery:
    restart: unless-stopped
    build: ./backend
    env_file: .env
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - OPENAI_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      # celery 不直接做 chat，但保留同步避免误用
      - CHAT_MODEL=qwen3.7-max
      - ENABLE_THINKING=false
      # 后台事实抽取 / 纠错判别用 plus 即可，性价比更高
      - EXTRACT_MODEL=qwen3.7-plus
      - CORRECTION_MODEL=qwen3.7-plus
      - QDRANT_HOST=qdrant
      - REDIS_URL=redis://redis:6379/0
      - USER_DB_PATH=/app/data/memobot.db
    volumes:
      - ./backend:/app
      - memobot_data:/app/data
    command: >
      sh -c "unset NO_PROXY no_proxy ALL_PROXY all_proxy HTTP_PROXY http_proxy HTTPS_PROXY https_proxy && watchmedo auto-restart --directory=/app --pattern=*.py --recursive -- celery -A celery_worker worker --loglevel=info"
    depends_on:
      - redis
      - qdrant

  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  celery-beat:
    restart: unless-stopped
    build: ./backend
    env_file: .env
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - OPENAI_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - CHAT_MODEL=qwen3.7-max
      - ENABLE_THINKING=false
      - EXTRACT_MODEL=qwen3.7-plus
      - CORRECTION_MODEL=qwen3.7-plus
      - QDRANT_HOST=qdrant
      - REDIS_URL=redis://redis:6379/0
      - USER_DB_PATH=/app/data/memobot.db
    volumes:
      - ./backend:/app
      - memobot_data:/app/data
    command: >
      sh -c "unset NO_PROXY no_proxy ALL_PROXY all_proxy HTTP_PROXY http_proxy HTTPS_PROXY https_proxy && celery -A celery_worker beat --loglevel=info"
    depends_on:
      - redis

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      target: dev
    ports:
      - "5175:5173"
    environment:
      - VITE_API_BASE=
      - VITE_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  qdrant_data:
  redis_data:
  memobot_data:
